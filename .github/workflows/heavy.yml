    inputs:
      source_ref:
        description: "Branch of sheltonsilas/Madeira to build"
        type: string
        default: "feature/two-variants-browser-and-linux"

permissions:
  contents: read

jobs:
  llvm-ios:
    name: LLVM 15 for iOS/arm64
    runs-on: macos-15
    # GitHub's hard ceiling for one job; the build is expected to take about an
    # hour, so this only stops a pathological run.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sheltonsilas/Madeira
          ref: ${{ inputs.source_ref }}
          # The LLVM source is a release tarball, not a submodule, so the
